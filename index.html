<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Свитковский Илья</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="main">
        <img src="img/logo.jpg" alt="logo" class="logo" id="logo">
        <header class="header">
            <h1 class="title">Свитковский Илья</h1>
            <p class="subtitle">Будущий миллиардер</p>
        </header>
        <container class="container">
            <button class="link-button" id="telegram"><h2 class="button-text">Telegram</h2></button>
            <button class="link-button" id="telegram_channel"><h2 class="button-text">Telegram Channel</h2></button>
            <button class="link-button" id="vkontakte"><h2 class="button-text">Vkontakte</h2></button>
            <button class="link-button" id="phone"><h2 class="button-text">Phone</h2></button>
        </container>
        <footer class="footer">
            <p class="footer-subtitle"><span class="span-copy">&#169;</span>Свитковский Илья</p>
        </footer>
    </main>
    <script src="js/script.js"></script>
</body>
</html>
